name: ci
on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
jobs:
  build:
    strategy:
      matrix:
        package:
          - emacs
          - emacs-nox
          - emacs-git
          - emacs-pgtk
        channel:
          - nixos-unstable
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Nix
      uses: cachix/install-nix-action@v27
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - uses: cachix/cachix-action@v15
      with:
        name: emacs-d
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: Build
      run: nix build '.#${{matrix.package}}'
    - name: Run
      run: nix run '.#${{matrix.package}}' -- --batch --load init.el
    - name: Push
      run: cachix push emacs-d $(nix path-info '.#${{matrix.package}}')
